databases:
  - name: brandguard-db
    databaseName: brandguard
    user: brandguard
    plan: free

services:
  - type: web
    name: brandguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        value: BrandGuard@123
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
